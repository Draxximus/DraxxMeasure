name: DraxxMeasure Windows portable

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.97.1'
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Check, build and verify Windows x64 ZIP
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Locate Cargo workspace
        id: workspace
        run: |
          $ErrorActionPreference = 'Stop'
          # This checkout has a parent Git root; also support a standalone repo.
          if (Test-Path -LiteralPath 'DraxxMeasure/Cargo.toml') { $source = 'DraxxMeasure' }
          elseif (Test-Path -LiteralPath 'Cargo.toml') { $source = '.' }
          else { throw 'DraxxMeasure Cargo workspace not found.' }
          "path=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install pinned Rust build toolchain
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy --target $env:WINDOWS_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustup override set $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Rust override failed.' }

      - name: Validate package version and tag
        id: version
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed.' }
          $cli = @($metadata.packages | Where-Object name -EQ 'draxx-cli')
          if ($cli.Count -ne 1) { throw 'Expected exactly one draxx-cli package.' }
          $version = $cli[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match Cargo package version: expected v$version."
          }
          "number=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Check formatting
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }

      - name: Check workspace
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo check failed.' }

      - name: Clippy
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }

      - name: Automated tests (including capacity, SQLite, recovery and PNG)
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed.' }

      - name: Build static-CRT release executable
        working-directory: ${{ steps.workspace.outputs.path }}
        run: |
          cargo build --release --locked --target $env:WINDOWS_TARGET -p draxx-cli --bin draxxmeasure
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Package allowlisted executable and documentation only
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          ./scripts/windows/package.ps1 -SourceDirectory . -OutputDirectory "$env:RUNNER_TEMP/draxxmeasure-package" -Version $env:PACKAGE_VERSION -Commit $env:GITHUB_SHA

      - name: Verify extracted release outside workspace without runtime tools
        working-directory: ${{ steps.workspace.outputs.path }}
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.number }}
        run: |
          ./scripts/windows/test-portable.ps1 -ArchivePath "$env:RUNNER_TEMP/draxxmeasure-package/DraxxMeasure-v${env:PACKAGE_VERSION}-windows-x64.zip" -ExpectedVersion $env:PACKAGE_VERSION

      - name: Upload verified portable ZIP and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: draxxmeasure-windows-x64-portable
          path: |
            ${{ runner.temp }}/draxxmeasure-package/*.zip
            ${{ runner.temp }}/draxxmeasure-package/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish verified tag release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: draxxmeasure-windows-x64-portable
          path: release-assets

      - name: Publish ZIP and checksum without replacing an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check -- *.sha256
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          args=(--verify-tag --generate-notes --title "DraxxMeasure $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 "${args[@]}"
