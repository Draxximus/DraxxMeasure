[workspace]
members = [
    "crates/draxx-core",
    "crates/draxx-storage",
    "crates/draxx-statistics",
    "crates/draxx-reporting",
    "crates/draxx-application",
    "apps/draxx-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
draxx-core = { path = "crates/draxx-core" }
draxx-storage = { path = "crates/draxx-storage" }
draxx-statistics = { path = "crates/draxx-statistics" }
draxx-reporting = { path = "crates/draxx-reporting" }
draxx-application = { path = "crates/draxx-application" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "line_series", "point_series", "ab_glyph"] }
image = { version = "0.25", default-features = false, features = ["png"] }
time = { version = "0.3", features = ["formatting"] }
csv = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
